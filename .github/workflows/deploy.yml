name: Nunnarri IoT Platform CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - claude
  pull_request:
    branches:
      - main
      - master
      - claude

jobs:
  build-and-test:
    name: Build & Validate Docker Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose Services
        run: |
          docker compose build

  deploy-to-server:
    name: Deploy to Remote Production Server
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/claude')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server via Native SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: "79.143.179.156"
          SERVER_USER: "root"
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "❌ Error: SSH_PRIVATE_KEY secret is not set in GitHub Secrets!"
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $SERVER_USER@$SERVER_HOST << 'EOF'
            echo "🚀 Starting Automated Deployment on Server..."
            
            TARGET_DIR="~/AI-universal-IOT-mangement"
            mkdir -p $TARGET_DIR
            cd $TARGET_DIR
            
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            fi

            git fetch --all
            git reset --hard origin/${{ github.ref_name }}
            
            export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
            export AI_PROVIDER="auto"
            
            docker compose up -d --build --remove-orphans
            docker image prune -f
            
            echo "✅ Nunnarri IoT Platform deployed successfully on 79.143.179.156!"
          EOF
