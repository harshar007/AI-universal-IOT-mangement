services:
  # User Database Service (PostgreSQL)
  user-db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: prabha0312
      POSTGRES_DB: user_db
    ports:
      - "5432:5432"
    volumes:
      - pguserdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d user_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # IoT Database Service (PostgreSQL)
  iot-db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: prabha0312
      POSTGRES_DB: nexus_iot_db
    expose:
      - "5432"
    volumes:
      - pgiotdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d nexus_iot_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Service (Node.js Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - USER_DATABASE_URL=postgres://postgres:prabha0312@user-db:5432/user_db
      - IOT_DATABASE_URL=postgres://postgres:prabha0312@iot-db:5432/nexus_iot_db
      - DATABASE_URL=postgres://postgres:prabha0312@iot-db:5432/nexus_iot_db
      - JWT_SECRET=nexus_super_secret_key_987654321
      - GATEWAY_URL=http://iot-gateway:5002
    depends_on:
      user-db:
        condition: service_healthy
      iot-db:
        condition: service_healthy

  # AI Backend Service (Node.js Express)
  ai-backend:
    build:
      context: ./ai-backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5006:5006"
    environment:
      - PORT=5006
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=tinyllama
      - IOT_DATABASE_URL=postgres://postgres:prabha0312@iot-db:5432/nexus_iot_db
      - JWT_SECRET=nexus_super_secret_key_987654321
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # IoT Communication Gateway Service
  iot-gateway:
    build:
      context: .
      dockerfile: iot-gateway/Dockerfile
    restart: always
    ports:
      - "5002:5002"
      - "1883:1883"
    environment:
      - PORT=5002
      - MQTT_BROKER_URL=mqtt://localhost:1883
      - DATABASE_URL=postgres://postgres:prabha0312@iot-db:5432/nexus_iot_db
      - JWT_SECRET=nexus_super_secret_key_987654321
    depends_on:
      iot-db:
        condition: service_healthy

  # Frontend Service (React / Vite + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
      - ai-backend
      - iot-gateway

volumes:
  pguserdata:
  pgiotdata:
